version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mindguard-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: mindguard-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
    depends_on:
      mysql:
        condition: service_healthy

  chroma:
    image: chromadb/chroma
    container_name: mindguard-chroma
    ports:
      - "8000:8000"

  ollama:
    image: ollama/ollama
    container_name: mindguard-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  mysql-data:
  ollama-data:
